name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Django and MariaDB
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_DATABASE: ehr_ci
          MARIADB_USER: ehr_ci
          MARIADB_PASSWORD: synthetic-ci-password
          MARIADB_ROOT_PASSWORD: synthetic-ci-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: synthetic-ci-only-secret-key-never-use-in-production
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      DB_ENGINE: django.db.backends.mysql
      DB_NAME: ehr_ci
      DB_USER: ehr_ci
      DB_PASSWORD: synthetic-ci-password
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      ALLOW_MEDIA_UPLOADS: "True"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
      - name: Run Django system check
        run: python manage.py check
      - name: Check migration drift
        run: python manage.py makemigrations --check --dry-run
      - name: Collect production static files
        run: python manage.py collectstatic --noinput
      - name: Run backend tests
        run: python manage.py test --verbosity 2

  frontend:
    name: React
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Run frontend tests
        run: npm test -- --runInBand --watchAll=false
        env:
          CI: "true"
      - name: Build frontend
        run: npm run build
        env:
          CI: "true"
